apiVersion: v1
kind: Service
metadata:
  name: weather-app
  namespace: weather-demo
  labels:
    app: weather-app
    app.kubernetes.io/name: weather-app
    app.kubernetes.io/part-of: weather-demo
spec:
  selector:
    app: weather-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
  # LoadBalancer via MetalLB — audience connects directly to this IP
  type: LoadBalancer
