apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weather-demo
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: weather-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # No persistence — cache is intentionally ephemeral (reset via pod restart)
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
